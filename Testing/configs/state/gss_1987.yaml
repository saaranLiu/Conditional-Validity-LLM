# State-stage content config for GSS 1987 network module (SSDataBench-style schema).
# Edit this file to change variable definitions, allowed values, and prompt wording.
# Per-respondent sample values remain in Survey/*/cleaned/*.jsonl and Testing/*/input/*.jsonl.

# Population framing only (SSDataBench-style). Do not name the survey instrument.
context: >
  the adult population (18+) in U.S. households in 1987

population_context:
  reference_year: 1987

prompt:
  opening: >
    You are simulating one *randomly selected* synthetic individual sampled from
  baseline_rules:
    - Use ONLY the allowed values listed below for each field.
    - If a field expects an array, return an array using zero or more allowed values.
  anti_typology_rules:
    - Preserve realistic population heterogeneity; do not collapse respondents into overly typical profiles.
    - Do not assume unusually good health, unusually high social support, or unusually average attitudes.

tasks:
  s0_baseline_state:
    instruction: >
      Generate the respondent's likely baseline state variables using only the
      background attributes provided.
    prompt_condition: format_only
    rule_sets: [baseline]
    include_health_in_input: false
    include_health_in_output: true
  s0b_anti_typology:
    instruction: >
      Generate the respondent's likely baseline state variables using only the
      background attributes provided.
    prompt_condition: format_anti_typology
    rule_sets: [baseline, anti_typology]
    # Same respondents/targets as Task 1; only the prompt rules differ.
    reuse_task_file: s0_baseline_state
    include_health_in_input: false
    include_health_in_output: true
  s1_health_conditioned:
    instruction: >
      Generate the respondent's remaining state variables using the background
      attributes and the observed self-rated health value provided.
    prompt_condition: format_only
    rule_sets: [baseline]
    include_health_in_input: true
    include_health_in_output: false
  s1b_anti_typology:
    instruction: >
      Generate the respondent's remaining state variables using the background
      attributes and the observed self-rated health value provided.
    prompt_condition: format_anti_typology
    rule_sets: [baseline, anti_typology]
    # Same respondents/targets as Task 2; only the prompt rules differ.
    reuse_task_file: s1_health_conditioned
    include_health_in_input: true
    include_health_in_output: false
  s2_politics_religion_conditioned:
    instruction: >
      Generate the respondent's remaining state variables using the background
      attributes and the observed party identity, religion, and voting values provided.
    prompt_condition: format_only
    rule_sets: [baseline]
    include_health_in_input: false
    include_health_in_output: true
    # Observed civic/religious state moved into the prompt (no Task 3b).
    conditioning_fields_in_input:
      - party_identity
      - religion
      - voting_1984
    exclude_output_keys:
      - party_identity
      - religion

input_variables:
  age:
    type: static
    description: Age in years
    domain: Demography
    allowed:
      type: numeric
      min: 18
      max: 89
  age_group:
    type: static
    description: Harmonized age group
    domain: Demography
    allowed:
      - under_21
      - "21_30"
      - "31_49"
      - "50_70"
      - "71_plus"
  sex:
    type: static
    description: Sex
    domain: Demography
    allowed:
      - female
      - male
  race_ethnicity:
    type: static
    description: Harmonized race/ethnicity
    domain: Demography
    allowed:
      - american indian or alaska native
      - asian indian
      - black
      - black or african american
      - chinese
      - filipino
      - hispanic
      - japanese
      - korean
      - other
      - other asian
      - other pacific islander
      - some other race
      - vietnamese
      - white
  education_years:
    type: static
    description: Years of formal schooling
    domain: SES
    allowed:
      type: numeric
      min: 0
      max: 20
  degree:
    type: static
    description: Highest degree
    domain: SES
    allowed:
      - less_than_high_school
      - high_school
      - associate_or_junior_college
      - bachelors
      - graduate
  marital_status:
    type: static
    description: Marital status
    domain: Family
    allowed:
      - married
      - widowed
      - divorced
      - separated
      - never married
  children_count:
    type: static
    description: Number of children ever born
    domain: Family
    allowed:
      type: numeric
      min: 0
      max: 8
  children_status:
    type: static
    description: Whether the respondent has children
    domain: Family
    allowed:
      - has_children
      - no_children
  work_status:
    type: static
    description: Current labor-force / work status
    domain: SES
    allowed:
      - working full time
      - working part time
      - with a job, but not at work because of temporary illness, vacation, strike
      - unemployed, laid off, looking for work
      - retired
      - in school
      - keeping house
      - other
  region:
    type: static
    description: U.S. census region
    domain: Demography
    allowed:
      - northeast
      - midwest
      - south
      - west
  self_rated_health:
    type: static
    description: Respondent's self-rated overall health
    domain: HealthWellBeing
    role: task2_conditioning_only
    allowed:
      - excellent
      - good
      - fair
      - poor
  voting_1984:
    type: static
    description: Whether the respondent voted in the 1984 U.S. presidential election (GSS VOTE84).
    domain: Politics
    role: task3_conditioning_only
    allowed:
      - voted
      - did not vote
      - ineligible

output_variables:
  self_rated_health:
    type: static
    description: Respondent's self-rated overall health.
    domain: HealthWellBeing
    allowed:
      - excellent
      - good
      - fair
      - poor
  general_happiness:
    type: static
    description: Respondent's general happiness.
    domain: HealthWellBeing
    allowed:
      - not too happy
      - pretty happy
      - very happy
  people_can_be_trusted:
    type: static
    description: Whether most people can be trusted.
    domain: SocialTrust
    allowed:
      - can't be too careful
      - depends
      - most people can be trusted
  people_are_fair:
    type: static
    description: Whether people try to be fair or take advantage.
    domain: SocialTrust
    allowed:
      - depends
      - would take advantage of you
      - would try to be fair
  people_are_helpful:
    type: static
    description: Whether people try to be helpful or look out for themselves.
    domain: SocialTrust
    allowed:
      - depends
      - looking out for themselves
      - try to be helpful
  party_identity:
    type: static
    description: Respondent's political party identity.
    domain: Politics
    allowed:
      - independent (neither, no response)
      - independent, close to democrat
      - independent, close to republican
      - not very strong democrat
      - not very strong republican
      - other party
      - strong democrat
      - strong republican
  political_ideology:
    type: static
    description: Respondent's liberal-conservative political ideology.
    domain: Politics
    allowed:
      - conservative
      - extremely conservative
      - extremely liberal
      - liberal
      - moderate, middle of the road
      - slightly conservative
      - slightly liberal
  religion:
    type: static
    description: Respondent's religious preference.
    domain: Religion
    allowed:
      - buddhism
      - catholic
      - christian
      - hinduism
      - inter-nondenominational
      - jewish
      - muslim/islam
      - native american
      - none
      - orthodox-christian
      - other
      - other eastern religions
      - protestant
  religious_service_attendance:
    type: static
    description: How often the respondent attends religious services.
    domain: Religion
    allowed:
      - 2-3 times a month
      - about once a month
      - about once or twice a year
      - every week
      - less than once a year
      - nearly every week
      - never
      - several times a week
      - several times a year
  religious_affiliation_strength:
    type: static
    description: Strength of respondent's religious affiliation.
    domain: Religion
    allowed:
      - no religion
      - not very strong
      - somewhat strong (vol.)
      - strong

original_data:
  source: GSS1987_network
  description: >
    GSS 1987 ego-network module respondents (GSS/network/1987/ego.csv) for State-stage
    state-stage evaluation with network follow-on.
  file: ./Survey/gss/cleaned/gss_1987_state_clean.csv
  task_files:
    s0_baseline_state: ./Survey/gss/cleaned/gss_1987_s0.jsonl
    s1_health_conditioned: ./Survey/gss/cleaned/gss_1987_s1.jsonl
    s2_politics_religion_conditioned: ./Survey/gss/cleaned/gss_1987_s2.jsonl
