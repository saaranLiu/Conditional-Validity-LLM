# State-stage content config for UCNets Wave 1 (SSDataBench-style schema).
# Edit this file to change variable definitions, allowed values, and prompt wording.
# Per-respondent sample values remain in Survey/*/cleaned/*.jsonl and Testing/*/input/*.jsonl.

# Population framing only (SSDataBench-style). Do not name the survey instrument.
context: >
  adults in the San Francisco Bay Area in 2015, including younger adults aged
  21-30 and older adults aged 50-70

population_context:
  reference_year: 2015

prompt:
  opening: >
    You are simulating one *randomly selected* synthetic individual sampled from
  baseline_rules:
    - Use ONLY the allowed values listed below for each field.
    - If a field expects an array, return an array using zero or more allowed values.
  anti_typology_rules:
    - Preserve realistic population heterogeneity; do not collapse respondents into overly typical profiles.
    - Do not assume unusually good health, unusually high social support, or unusually average attitudes.

tasks:
  s0_baseline_state:
    instruction: >
      Generate the respondent's likely baseline state variables using only the
      background attributes provided.
    prompt_condition: format_only
    rule_sets: [baseline]
    include_health_in_input: false
    include_health_in_output: true
  s0b_anti_typology:
    instruction: >
      Generate the respondent's likely baseline state variables using only the
      background attributes provided.
    prompt_condition: format_anti_typology
    rule_sets: [baseline, anti_typology]
    # Same respondents/targets as Task 1; only the prompt rules differ.
    reuse_task_file: s0_baseline_state
    include_health_in_input: false
    include_health_in_output: true
  s1_health_conditioned:
    instruction: >
      Generate the respondent's remaining state variables using the background
      attributes and the observed self-rated health value provided.
    prompt_condition: format_only
    rule_sets: [baseline]
    include_health_in_input: true
    include_health_in_output: false
  s1b_anti_typology:
    instruction: >
      Generate the respondent's remaining state variables using the background
      attributes and the observed self-rated health value provided.
    prompt_condition: format_anti_typology
    rule_sets: [baseline, anti_typology]
    # Same respondents/targets as Task 2; only the prompt rules differ.
    reuse_task_file: s1_health_conditioned
    include_health_in_input: true
    include_health_in_output: false
  s2_politics_religion_conditioned:
    instruction: >
      Generate the respondent's remaining state variables using the background
      attributes and the observed party identity, current religion, religion raised,
      and voting values provided.
    prompt_condition: format_only
    rule_sets: [baseline]
    include_health_in_input: false
    include_health_in_output: true
    # Observed civic/religious state moved into the prompt (no Task 3b).
    conditioning_fields_in_input:
      - party_identity
      - religion_current
      - religion_raised
      - voting_frequency
    exclude_output_keys:
      - party_identity
      - religion_current
      - religion_raised
      - voting_frequency

input_variables:
  age:
    type: static
    description: Age in years
    domain: Demography
    allowed:
      type: numeric
      min: 21
      max: 70
  age_group:
    type: static
    description: UCNets age cohort
    domain: Demography
    allowed:
      - "21-30"
      - "50-70"
  gender:
    type: static
    description: Gender
    domain: Demography
    allowed:
      - female
      - male
  race_ethnicity:
    type: static
    description: Harmonized race/ethnicity
    domain: Demography
    allowed:
      - american indian
      - asian
      - black
      - hawaiian pac islander
      - mixed race
      - unknown
      - white
  education:
    type: static
    description: Highest educational attainment
    domain: SES
    allowed:
      - less_than_high_school
      - high_school_or_ged
      - some_college_or_associate
      - bachelors
      - graduate_or_professional
  work_status:
    type: static
    description: >
      Current work/activity status. Values may be single labels (e.g. full time)
      or multi-code strings from the original UCNets A21 item.
    domain: SES
    allowed:
      type: free_text
  marital_status:
    type: static
    description: Marital status
    domain: Family
    allowed:
      - married
      - widowed
      - divorced
      - separated
      - never married
  romantic_relationship:
    type: static
    description: Whether the respondent is in a romantic relationship
    domain: Family
    allowed:
      - "yes"
      - "no"
  household_other_people_count:
    type: static
    description: Number of other people in the household
    domain: Family
    allowed:
      type: numeric
      min: 0
      max: 8
  children_status:
    type: static
    description: Whether the respondent has children
    domain: Family
    allowed:
      - has_children
      - no_children
  self_rated_health:
    type: static
    description: Respondent's self-rated overall health
    domain: HealthWellBeing
    role: task2_conditioning_only
    allowed:
      - excellent
      - very good
      - good
      - fair
      - poor

output_variables:
  self_rated_health:
    type: static
    description: Respondent's self-rated overall health.
    domain: HealthWellBeing
    allowed:
      - excellent
      - very good
      - good
      - fair
      - poor
  days_very_happy_past_week:
    type: static
    description: Number of days in the past 7 days the respondent felt very happy.
    domain: HealthWellBeing
    allowed:
      type: numeric
      min: 0
      max: 7
  days_isolated_past_week:
    type: static
    description: Number of days in the past 7 days the respondent felt isolated from other people.
    domain: HealthWellBeing
    allowed:
      type: numeric
      min: 0
      max: 7
  days_lonely_past_week:
    type: static
    description: Number of days in the past 7 days the respondent felt lonely.
    domain: HealthWellBeing
    allowed:
      type: numeric
      min: 0
      max: 7
  relatives_help_serious_problem:
    type: static
    description: Whether the respondent can rely on relatives for a serious problem.
    domain: SocialSupport
    allowed:
      - definitely have
      - probably have
      - might have
      - probably dont have
  friends_help_serious_problem:
    type: static
    description: Whether the respondent can rely on friends for a serious problem.
    domain: SocialSupport
    allowed:
      - definitely have
      - probably have
      - might have
      - probably do not have
      - other
  wants_more_people_for_personal_concerns:
    type: static
    description: Whether the respondent wishes they knew more people to discuss personal concerns.
    domain: SocialSupport
    allowed:
      - know enough already
      - wish i knew more
  wants_more_people_for_good_time:
    type: static
    description: Whether the respondent wishes they knew more people to get together with for a good time.
    domain: SocialSupport
    allowed:
      - know enough already
      - wish i knew more
  wants_more_people_for_practical_help:
    type: static
    description: Whether the respondent wishes they knew more people for practical help.
    domain: SocialSupport
    allowed:
      - know enough already
      - wish i knew more
  personality:
    type: nested
    description: Big Five-style self-description items.
    domain: Personality
    allowed:
      reserved:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
      sociable:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
      trusting:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
      finds_fault_with_others:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
      handles_stress_well:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
      active_imagination:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
      few_artistic_interests:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
      lazy:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
      thorough:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
      nervous_easily:
        - strongly disagree
        - disagree
        - neither agree nor disagree
        - agree
        - strongly agree
  ever_goes_online:
    type: static
    description: Whether the respondent ever goes online.
    domain: Contact
    allowed:
      - "yes"
      - "no"
  family_contact_methods_weekly:
    type: array
    description: Methods used at least weekly to stay in touch with family.
    domain: Contact
    allowed:
      - letters
      - landline
      - cell_call
      - text
      - email
      - instant_message
      - social_media
      - video
      - none
  friend_contact_methods_weekly:
    type: array
    description: Methods used at least weekly to stay in touch with friends.
    domain: Contact
    allowed:
      - letters
      - landline
      - cell_call
      - text
      - email
      - instant_message
      - social_media
      - video
      - none
  voting_frequency:
    type: static
    description: How often the respondent votes.
    domain: Politics
    allowed:
      - most elections
      - some elections
      - usually doesnt vote
  party_identity:
    type: static
    description: Respondent's political party identity.
    domain: Politics
    allowed:
      - democrat
      - republican
  religion_current:
    type: static
    description: Respondent's current religion.
    domain: Religion
    allowed:
      - buddhist
      - catholic
      - jewish
      - muslim
      - no religion
      - protestant
  religion_raised:
    type: static
    description: Religion in which the respondent was raised.
    domain: Religion
    allowed:
      - buddhist
      - catholic
      - jewish
      - muslim
      - no religion
      - protestant

original_data:
  source: UCNets_Wave1
  description: >
    UCNets Wave 1 cleaned subset used for State-stage state-stage evaluation.
  file: ./Survey/ucnets/cleaned/ucnets_w1_state_clean.csv
  task_files:
    s0_baseline_state: ./Survey/ucnets/cleaned/ucnets_w1_s0.jsonl
    s1_health_conditioned: ./Survey/ucnets/cleaned/ucnets_w1_s1.jsonl
    s2_politics_religion_conditioned: ./Survey/ucnets/cleaned/ucnets_w1_s2.jsonl
