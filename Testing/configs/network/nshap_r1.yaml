# Phase 2 content config for NSHAP round 1.
# Population framing only. Do not name the survey instrument.
#
# SUPPLEMENTARY dataset with two jobs:
#   1. Large-N closure replication. The alter-alter contact matrix is observed, not
#      inferred, so density is a measured quantity here. 2931 egos, versus 1393 in the
#      largest GSS year that carries alter-alter data.
#   2. Population contrast. The sample is adults aged 57+, whose networks are smaller and
#      more kin-heavy than UCNets (mean roster 3.47). A generator that returns the same
#      modal network here as for UCNets is showing insensitivity to the population it was
#      asked about.
#
# Deliberately NOT run here: T5 (intervention additivity). T4 (S0 → R1) is a
# separate generation wave; R0 equals this file's N0.
#
# Why only round 1: rounds 2 and 3 are cleaned and available, but running all three is a
# within-survey replication this project does not need, at triple the generation cost.
# Round 1 has the complete field set -- round 3 dropped the closeness item entirely.
#
# Two fields are deliberately absent from the schema below because the human data cannot
# score them: alter age (`NODE_AGE` is only ~20% populated) and how long the alter has
# been known (`LONGKNOW`, ~30%). Asking the model for fields we cannot compare against
# buys nothing and lengthens the output.

dataset: nshap_r1

# The confidant roster caps at 5 and is the person's COMPLETE nomination list, so its
# length must equal num_alters. Same shape as the GSS years, unlike the UCNets fixed Top-5.
roster:
  key: alters
  mode: variable
  min_size: 1
  max_size: 5
  rank_field: alter_id

context: >
  adults aged 57 and older living in the United States in 2005

population_context:
  reference_year: 2005

prompt:
  opening: >
    You are simulating one *randomly selected* synthetic individual sampled from
  baseline_rules:
    - Use ONLY the allowed values listed below for each field.
    - If a field expects an array, return an array using zero or more allowed values.
    - Do NOT invent keys outside the required schema.
    - alters must list every person in this individual's confidant network, at most 5, with alter_id numbered 1 upward.
    - composition_summary.num_alters must equal the number of objects in alters.
    - alter_ties must contain one entry for every unordered pair of alters, so an individual with n alters has n*(n-1)/2 entries.
    - Do not copy stereotypical "spouse + two friends" templates unless the state truly supports it.
  # This population is older than the other datasets in this project: widowhood, adult
  # children and co-residence are common, and the relationship vocabulary is wider.
  schema_description_lines:
    # Each proportion is spelled out as a single bare number. With two array-valued keys
    # in this schema (alters and alter_ties), the compact "proportions in [0, 1]" phrasing
    # that works for UCNets made the model return [0.5] instead of 0.5 for these fields.
    - "- composition_summary.num_alters: a single integer from 1 to 5"
    - "- composition_summary.size_bucket: one of {size_bucket} (small=1-2, medium=3-4, large=5)"
    - "- composition_summary.kin_share: a single decimal number from 0 to 1, NOT an array"
    - "- composition_summary.friend_share: a single decimal number from 0 to 1, NOT an array"
    - "- composition_summary.weekly_contact_share: a single decimal number from 0 to 1, NOT an array; the proportion of alters this person talks with once a week or more"
    - "- composition_summary.density_weekly: a single decimal number from 0 to 1, NOT an array; the proportion of alter PAIRS who talk with each other once a week or more"
    - "- alters: array of 1 to 5 objects, one per person named"
    - "  - alter_id: 1..num_alters"
    - "  - relationship: one of {relationship}"
    - "  - gender: one of {gender}"
    - "  - lives_with_ego: one of {lives_with_ego}"
    - "  - contact_frequency: one of {contact_frequency}"
    - "  - closeness_to_ego: one of {closeness_to_ego}"
    - "- alter_ties: array of objects describing how often each pair of alters talk with EACH OTHER"
    - "  - src_id / tgt_id: alter_id values, src_id < tgt_id"
    - "  - contact_frequency: one of {contact_frequency}"

tasks:
  n0_baseline_network:
    instruction: >
      Given this person's observed baseline state attributes, generate their likely
      confidant network: the people with whom they discussed things that were important
      to them over the past twelve months. Report a composition_summary, the full list
      of alters, and how often each pair of alters talk with each other.
    prompt_condition: format_only
    include_size_bucket: false
    include_population_priors: false
    generation_mode: oneshot
    subsample_n: 1000

  n4c_closure:
    instruction: >
      Given this person's observed baseline state attributes and the observed degree of
      contact among their alters, generate their likely confidant network:
      composition_summary, the full list of alters, and how often each pair of alters
      talk with each other. The share of alter pairs who talk weekly or more must be
      consistent with the provided closure bucket.
    prompt_condition: format_only
    include_size_bucket: false
    include_population_priors: false
    generation_mode: oneshot
    subsample_n: 1000
    # Closure is undefined for a one-alter network -- there is no pair to be close. About
    # 11% of this round's respondents named one confidant, and the `fallback` below would
    # hand each of them an invented "medium" closure with nothing in the gold to score it
    # against. Drop them instead; the baseline arm still covers them.
    require_condition_bucket: true
    condition_bucket:
      source: density_weekly_bucket
      prompt_key: alter_closure_bucket
      fallback: medium
      # This round's own empirical tertiles, not UCNets' and not the GSS years'.
      rule: >-
        - alter_closure_bucket is an observed conditioning attribute describing the share of
        this person's alter pairs who talk with each other once a week or more (low<0.20,
        medium 0.20-0.49, high>=0.50). The contact_frequency values in alter_ties should be
        consistent with this bucket.

relationship_allowed:
  - spouse
  - ex_spouse
  - romantic_partner
  - parent
  - parent_in_law
  - child
  - step_child
  - sibling
  - other_relative
  - other_in_law
  - friend
  - neighbor
  - coworker_or_boss
  - clergy
  - therapist
  - social_worker
  - home_health_provider
  - other

gender_allowed:
  - male
  - female

lives_with_ego_allowed:
  - "yes"
  - "no"
  - part_of_the_year

contact_frequency_allowed:
  - never_spoken
  - less_than_once_a_year
  - once_a_year
  - a_couple_times_a_year
  - once_a_month
  - once_every_two_weeks
  - once_a_week
  - several_times_a_week
  - every_day

closeness_to_ego_allowed:
  - not_very_close
  - somewhat_close
  - very_close
  - extremely_close

size_bucket_allowed:
  - small
  - medium
  - large

closure_bucket_allowed:
  - low
  - medium
  - high

output_schema:
  top_level_keys:
    - composition_summary
    - alters
    - alter_ties
  composition_summary:
    num_alters:
      type: numeric
      min: 1
      max: 5
    size_bucket:
      - small
      - medium
      - large
    kin_share:
      type: numeric
      min: 0
      max: 1
    friend_share:
      type: numeric
      min: 0
      max: 1
    weekly_contact_share:
      type: numeric
      min: 0
      max: 1
    density_weekly:
      type: numeric
      min: 0
      max: 1
  core_alter_fields:
    alter_id:
      type: numeric
      min: 1
      max: 5
    relationship: null
    gender: null
    lives_with_ego: null
    contact_frequency: null
    closeness_to_ego: null
  extra_lists:
    alter_ties:
      max_len: 10  # C(5,2)
      fields:
        src_id:
          type: numeric
          min: 1
          max: 5
        tgt_id:
          type: numeric
          min: 1
          max: 5
        contact_frequency: null

evaluation:
  size_bucket_bounds:
    small: [1, 2]
    medium: [3, 4]
    large: [5, 5]
  share_fields:
    - kin_share
    - friend_share
    - weekly_contact_share
    - density_weekly
  count_fields:
    - num_alters
  associations:
    - {outcome: kin_share, anchor: marital_status}
    - {outcome: kin_share, anchor: education}
    - {outcome: num_alters, anchor: self_rated_health}
    - {outcome: density_weekly, anchor: marital_status}
  t3_targets:
    n4c_closure:
      gold_field: density_weekly
      bucket_field: density_weekly_bucket
      prompt_key: alter_closure_bucket
      compute:
        kind: pair_share
        field: contact_frequency
        positive: [once_a_week, several_times_a_week, every_day]
