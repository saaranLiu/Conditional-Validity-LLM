# Phase 2 content config for the 2024 GSS network module.
# Population framing only. Do not name the survey instrument.
#
# SUPPLEMENTARY dataset with two narrow jobs:
#   1. Contamination check. Collection postdates the generator's training cutoff, so a
#      result that holds here is not explained by memorised survey content. This works at
#      the level of the BASELINE arm (size and composition), which every year shares.
#   2. One interval-following arm, on contact frequency.
#
# Why not race homophily here: same_race_share splits 24/10/66 across this year's own
# tertiles. A 10% middle bucket fails the project's minimum bucket share, so the cleaner
# now refuses to label it and every ego would fall through to the `fallback` value --
# an arm that looks like it runs while carrying no variation in the conditioning signal.
# pct_weekly_plus_contact (31/18/51) is the only estimand this year can actually condition
# on. Race homophily is degenerate in every GSS year and in UCNets alike; that is a
# finding about the estimand, not a gap in this year.
#
# Consequence to keep in view: this year's alter table records race, relationship and
# contact frequency only -- no alter gender, age, education or religion, no sibling flag,
# and no alter-alter matrix. So the arms that other years use for interval-following
# (same_sex_share, esp_close_density) cannot be reproduced here at all, and the
# contamination argument rests on the baseline arm rather than on a matched T3 arm.

dataset: gss_2024

roster:
  key: alters
  mode: variable
  min_size: 1
  max_size: 5
  rank_field: alter_id

context: >
  adults in the United States in 2024

population_context:
  reference_year: 2024

prompt:
  opening: >
    You are simulating one *randomly selected* synthetic individual sampled from
  baseline_rules:
    - Use ONLY the allowed values listed below for each field.
    - If a field expects an array, return an array using zero or more allowed values.
    - Do NOT invent keys outside the required schema.
    - alters must list every person in this individual's discussion network, at most 5, with alter_id numbered 1 upward.
    - composition_summary.num_alters must equal the number of objects in alters.
    - Do not copy stereotypical "spouse + two friends" templates unless the state truly supports it.
  schema_description_lines:
    # Each proportion is spelled out as a single bare number. The compact
    # "proportions in [0, 1]" phrasing made llama3.1 return [0.5] instead of 0.5 for these
    # fields, which failed schema validation on 7 of 12 pilot rows.
    - "- composition_summary.num_alters: a single integer from 1 to 5"
    - "- composition_summary.size_bucket: one of {size_bucket} (small=1-2, medium=3-4, large=5)"
    - "- composition_summary.kin_share: a single decimal number from 0 to 1, NOT an array"
    - "- composition_summary.friend_share: a single decimal number from 0 to 1, NOT an array"
    - "- composition_summary.coworker_share: a single decimal number from 0 to 1, NOT an array"
    - "- composition_summary.pct_weekly_plus_contact: a single decimal number from 0 to 1, NOT an array; the proportion contacted almost_daily or weekly"
    - "- alters: array of 1 to 5 objects, one per person named"
    - "  - alter_id: 1..num_alters"
    - "  - relationship: one of {relationship}"
    - "  - race: one of {race}"
    - "  - contact_frequency: one of {contact_frequency}"

tasks:
  n0_baseline_network:
    instruction: >
      Given this person's observed baseline state attributes, generate their likely
      core discussion network: the people with whom they discussed matters important
      to them over the past six months. Report a composition_summary and the full
      list of alters.
    prompt_condition: format_only
    include_size_bucket: false
    include_population_priors: false
    generation_mode: oneshot

  n4_contact:
    instruction: >
      Given this person's observed baseline state attributes and the observed share of
      their alters they are in frequent contact with, generate their likely core
      discussion network: composition_summary and the full list of alters. The
      contact_frequency values among alters must be consistent with the provided bucket.
    prompt_condition: format_only
    include_size_bucket: false
    include_population_priors: false
    generation_mode: oneshot
    # 条件桶为空时剔除该 ego，而不是用 fallback 编一个标签。见登记表 5.1。
    require_condition_bucket: true
    condition_bucket:
      source: pct_weekly_plus_contact_bucket
      prompt_key: contact_frequency_bucket
      fallback: high
      # This sample's own tertiles. See the header for why race homophily is not used.
      rule: >-
        - contact_frequency_bucket is an observed conditioning attribute describing the share of
        this person's alters they contact weekly or more often (low<0.75, medium 0.75-0.99,
        high=1.0). The contact_frequency values among alters should be consistent with this bucket.

relationship_allowed:
  - spouse
  - parent
  - child
  - other_relative
  - coworker
  - group_member
  - neighbor
  - friend
  - advisor
  - other

contact_frequency_allowed:
  - almost_daily
  - weekly
  - monthly
  - less_than_monthly

race_allowed:
  - asian
  - black
  - hispanic
  - white
  - other

size_bucket_allowed:
  - small
  - medium
  - large

same_race_share_bucket_allowed:
  - low
  - medium
  - high

output_schema:
  top_level_keys:
    - composition_summary
    - alters
  composition_summary:
    num_alters:
      type: numeric
      min: 1
      max: 5
    size_bucket:
      - small
      - medium
      - large
    kin_share:
      type: numeric
      min: 0
      max: 1
    friend_share:
      type: numeric
      min: 0
      max: 1
    coworker_share:
      type: numeric
      min: 0
      max: 1
    pct_weekly_plus_contact:
      type: numeric
      min: 0
      max: 1
  core_alter_fields:
    alter_id:
      type: numeric
      min: 1
      max: 5
    relationship: null
    race: null
    contact_frequency: null

evaluation:
  size_bucket_bounds:
    small: [1, 2]
    medium: [3, 4]
    large: [5, 5]
  share_fields:
    - kin_share
    - friend_share
    - coworker_share
    - pct_weekly_plus_contact
  count_fields:
    - num_alters
  associations:
    - {outcome: kin_share, anchor: age_group}
    - {outcome: kin_share, anchor: marital_status}
    - {outcome: num_alters, anchor: degree}
    - {outcome: pct_weekly_plus_contact, anchor: age_group}
  t3_targets:
    n4_contact:
      gold_field: pct_weekly_plus_contact
      bucket_field: pct_weekly_plus_contact_bucket
      prompt_key: contact_frequency_bucket
      compute:
        kind: flag_share
        field: contact_frequency
        positive: [almost_daily, weekly]
