# ISSP 2017 social-resource profile. T6 only: no name generator, no network stage.
# Population framing only. Do not name the survey instrument.
#
# The prompt template is identical across countries. Country enters as the sampled
# population in the opening line and as a field in prompt_json. Individual background
# (age, gender, education, …) stays human; resource_summary is the estimand.
# Full file is 44044 rows; this arm draws 80 people per country (2400) so each of
# the 30 country means is estimated on the same n.

dataset: issp_2017

roster:
  mode: none

context: >
  adults living in {country} in 2017

population_context:
  reference_year: 2017

prompt:
  opening: >
    You are simulating one *randomly selected* synthetic individual sampled from
  baseline_rules:
    - Use ONLY the allowed values listed below for each field.
    - If a field expects an array, return an array using zero or more allowed values.
    - Do NOT invent keys outside the required schema.
    - Each share field is a single decimal number from 0 to 1, NOT an array.
    - occupational_access_count is a single integer from 0 to 10, the number of listed
      occupations this person knows someone in.
    - Do not collapse every country into the same stereotypical profile.
  schema_description_lines:
    - "- resource_summary.occupational_access_count: a single integer from 0 to 10"
    - "- resource_summary.kin_channel_share: a single decimal number from 0 to 1, NOT an array; among known occupations, the share known through family"
    - "- resource_summary.friend_channel_share: a single decimal number from 0 to 1, NOT an array; among known occupations, the share known through a close friend"
    - "- resource_summary.acquaintance_channel_share: a single decimal number from 0 to 1, NOT an array; among known occupations, the share known through other acquaintances"
    - "- resource_summary.support_family_share: a single decimal number from 0 to 1, NOT an array; among everyday help items, the share this person would turn to family for"
    - "- resource_summary.support_friend_share: a single decimal number from 0 to 1, NOT an array"
    - "- resource_summary.support_no_one_share: a single decimal number from 0 to 1, NOT an array"
    - "- resource_summary.institutional_reliance_share: a single decimal number from 0 to 1, NOT an array; among larger needs, the share this person would turn to an organisation for"
    - "- resource_summary.institutional_personal_share: a single decimal number from 0 to 1, NOT an array"
    - "- resource_summary.institutional_no_one_share: a single decimal number from 0 to 1, NOT an array"
    - "- resource_summary.weekly_plus_role_contact_share: a single decimal number from 0 to 1, NOT an array; among parent/sibling/adult-child/other-family/close-friend relationships that exist, the share contacted weekly or more"
    - "- resource_summary.contact_volume_band: one of {contact_volume_band}"

prompt_exclude_keys:
  - country_code

extra_leak_keys:
  - occupational_items_answered
  - acquaintance_channel_share
  - support_friend_share
  - support_no_one_share
  - institutional_personal_share
  - institutional_no_one_share
  - contact_volume_band
  - kin_channel_any
  - friend_channel_any
  - institutional_reliance_any
  - resource_detail

tasks:
  t6_country_resources:
    instruction: >
      Given this person's country and observed background attributes, generate their
      likely social-resource profile: how many of ten common occupations they know
      someone in and through which channel, whom they would turn to for everyday help
      and for larger needs, and how often they see close family and friends.
    prompt_condition: format_only
    include_size_bucket: false
    include_population_priors: false
    generation_mode: oneshot
    subsample_per_country: 80

contact_volume_band_allowed:
  - 0_to_4_people
  - 5_to_9
  - 10_to_19
  - 20_to_49
  - 50_to_99
  - 100_or_more

output_schema:
  top_level_keys:
    - resource_summary
  resource_summary:
    occupational_access_count:
      type: numeric
      min: 0
      max: 10
    kin_channel_share:
      type: numeric
      min: 0
      max: 1
    friend_channel_share:
      type: numeric
      min: 0
      max: 1
    acquaintance_channel_share:
      type: numeric
      min: 0
      max: 1
    support_family_share:
      type: numeric
      min: 0
      max: 1
    support_friend_share:
      type: numeric
      min: 0
      max: 1
    support_no_one_share:
      type: numeric
      min: 0
      max: 1
    institutional_reliance_share:
      type: numeric
      min: 0
      max: 1
    institutional_personal_share:
      type: numeric
      min: 0
      max: 1
    institutional_no_one_share:
      type: numeric
      min: 0
      max: 1
    weekly_plus_role_contact_share:
      type: numeric
      min: 0
      max: 1
    contact_volume_band: null
