# Conda env for SocioSim / ego-network LLM experiments.
# Create:  conda env create -f Env/environment-sociosim.yml
# Activate: conda activate sociosim
#
# Note: CUDA PyTorch + HuggingFace are installed via pip after create
# (see pip section). Recreate with:
#   conda env create -f Env/environment-sociosim.yml
# Or on an existing env, re-run the pip lines below.

name: sociosim
channels:
  - defaults
dependencies:
  - python=3.11
  - numpy
  - pandas
  - polars
  - pyarrow
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - pyyaml
  - tqdm
  - requests
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      # CUDA 12.1 wheels (driver >= 12.2 on this machine)
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - transformers
      - accelerate
      - huggingface_hub
      - tokenizers
      - safetensors
      - sentencepiece
      - protobuf
      - einops
